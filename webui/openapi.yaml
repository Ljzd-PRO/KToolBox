components:
  schemas:
    AboutResponse:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        description:
          type: string
          title: Description
        license:
          type: string
          title: License
        authors:
          items:
            type: string
          type: array
          title: Authors
        python_version:
          type: string
          title: Python Version
        urls:
          additionalProperties:
            type: string
          type: object
          title: Urls
      type: object
      required:
      - name
      - version
      - description
      - license
      - authors
      - python_version
      - urls
      title: AboutResponse
    ActiveDownload:
      properties:
        creator_key:
          type: string
          title: Creator Key
        filename:
          type: string
          title: Filename
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
        completed:
          type: integer
          title: Completed
          default: 0
        speed_bps:
          type: number
          title: Speed Bps
          default: 0
      type: object
      required:
      - creator_key
      - filename
      title: ActiveDownload
    AutomaticCreatorWindowSnapshot:
      properties:
        creator_key:
          type: string
          title: Creator Key
        start_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start At
        end_at:
          type: string
          format: date-time
          title: End At
        timezone:
          type: string
          title: Timezone
        baseline:
          type: boolean
          title: Baseline
          default: false
      type: object
      required:
      - creator_key
      - end_at
      - timezone
      title: AutomaticCreatorWindowSnapshot
    AutomaticSyncOptions:
      properties:
        output:
          anyOf:
          - type: string
            format: path
          - type: 'null'
          title: Output
        save_creator_indices:
          type: boolean
          title: Save Creator Indices
          default: false
        mix_posts:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Mix Posts
        keywords:
          items:
            type: string
          type: array
          uniqueItems: true
          title: Keywords
        keywords_exclude:
          items:
            type: string
          type: array
          uniqueItems: true
          title: Keywords Exclude
      additionalProperties: false
      type: object
      title: AutomaticSyncOptions
      description: Reusable synchronization settings attached to an automatic plan.
    AutomaticSyncPlan:
      properties:
