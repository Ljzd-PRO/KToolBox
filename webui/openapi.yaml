          type: integer
          title: Revision
        progress:
          $ref: '#/components/schemas/TaskProgress'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        failure:
          anyOf:
          - $ref: '#/components/schemas/TaskFailureReport'
          - type: 'null'
        blocked_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Blocked By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - kind
      - status
      - spec
      - position
      - revision
      - created_at
      - updated_at
      title: TaskRecord
    TaskStatus:
      type: string
      enum:
      - queued
      - blocked
      - running
      - pause_requested
      - paused
      - stop_requested
      - stopped
      - completed
      - failed
      - interrupted
      title: TaskStatus
    TaskUpdateRequest:
      properties:
        spec:
          oneOf:
          - $ref: '#/components/schemas/DownloadTaskSpec'
          - $ref: '#/components/schemas/SyncTaskSpec'
          title: Spec
          discriminator:
            propertyName: kind
            mapping:
              download: '#/components/schemas/DownloadTaskSpec'
              sync: '#/components/schemas/SyncTaskSpec'
        presentation:
          anyOf:
          - $ref: '#/components/schemas/TaskPresentationSnapshot'
          - type: 'null'
      type: object
      required:
      - spec
      title: TaskUpdateRequest
    TextDocumentResponse:
      properties:
        name:
          type: string
          title: Name
        path:
          type: string
          format: path
          title: Path
        content:
          type: string
          title: Content
        revision:
          type: string
          title: Revision
      type: object
      required:
      - name
      - path
      - content
      - revision
      title: TextDocumentResponse
    TextDocumentUpdate:
      properties:
        content:
          type: string
          title: Content
      type: object
      required:
      - content
      title: TextDocumentUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
