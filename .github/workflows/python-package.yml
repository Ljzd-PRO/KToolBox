name: Python Package

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "ktoolbox/**"
      - "custom_templates/**"
      - "webui/**"
      - ".github/actions/**"
      - ".github/workflows/python-package.yml"
      - "ktoolbox.spec"
      - "scripts/check_webui_wheel.py"
      - "scripts/smoke_test_executable.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "example.env"
      - "README*.md"
      - "LICENSE"
  pull_request:
    paths:
      - "ktoolbox/**"
      - "custom_templates/**"
      - "webui/**"
      - ".github/actions/**"
      - ".github/workflows/python-package.yml"
      - "ktoolbox.spec"
      - "scripts/check_webui_wheel.py"
      - "scripts/smoke_test_executable.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "example.env"
      - "README*.md"
      - "LICENSE"

jobs:
  build-wheels:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          install-project: "false"

      - name: Build package with Poetry
        run: poetry build

      - name: Verify wheel contains the production WebUI
        run: poetry run python scripts/check_webui_wheel.py

      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: ktoolbox-wheels
          path: dist

  create-executable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            arch: x64
            python-arch: "x64"
            install-event-loop: "true"
          - os: windows-latest
            arch: x86
            python-arch: "x86"
            # winloop no longer publishes 32-bit Windows wheels.
            install-event-loop: "false"
          
          # macOS builds  
          - os: macos-latest
            arch: arm64
            python-arch: "arm64"
            install-event-loop: "true"
          - os: macos-15-intel
            arch: x64
            python-arch: "x64"
            install-event-loop: "true"
          
          # Linux builds
          - os: ubuntu-latest
            arch: x64
            python-arch: "x64"
            install-event-loop: "true"
          - os: ubuntu-24.04-arm
            arch: arm64
            python-arch: "arm64"
            install-event-loop: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python-arch }}
          poetry-install-arguments: "--with pyinstaller --extras urwid --extras webui"
          install-event-loop: ${{ matrix.install-event-loop }}

      - name: Create executable
        uses: ./.github/actions/pyinstaller

      - name: Smoke-test executable (Unix)
        if: runner.os != 'Windows'
        run: poetry run python scripts/smoke_test_executable.py dist/ktoolbox

      - name: Smoke-test executable (Windows)
        if: runner.os == 'Windows'
        run: poetry run python scripts/smoke_test_executable.py dist/ktoolbox.exe

      - name: Upload Executable
        uses: actions/upload-artifact@v7
        with:
          name: ktoolbox-${{ runner.os }}-${{ matrix.arch }}
          path: dist
