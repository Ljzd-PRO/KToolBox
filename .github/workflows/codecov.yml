name: Code Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - devel
      - pure-py
      - pawchive
    paths:
      - "ktoolbox/**"
      - "k_generator/**"
      - "scripts/**"
      - "tests/**"
      - "webui/**"
      - ".github/actions/setup-python/**"
      - ".github/workflows/codecov.yml"
      - "pyproject.toml"
      - "poetry.lock"
  pull_request:
    paths:
      - "ktoolbox/**"
      - "k_generator/**"
      - "scripts/**"
      - "tests/**"
      - "webui/**"
      - ".github/actions/setup-python/**"
      - ".github/workflows/codecov.yml"
      - "pyproject.toml"
      - "poetry.lock"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Full Coverage (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          poetry-install-arguments: "--with test,dev --extras urwid --extras webui"
          install-event-loop: "false"

      - name: Run full test suite with coverage
        run: poetry run pytest -v --capture=sys --cov --cov-report=xml tests/

      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          flags: python-3.12
          fail_ci_if_error: true

  compatibility:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-15
            python-version: "3.12"
          - os: macos-15
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          poetry-install-arguments: "--with test,dev --extras urwid --extras webui"
          install-event-loop: "false"

      - name: Run portable core test suite
        if: runner.os != 'Windows'
        run: >-
          poetry run pytest -q tests/ktoolbox
          --ignore-glob="tests/ktoolbox/test_webui_*.py"
          --ignore=tests/ktoolbox/test_auto_sync_routes.py

      - name: Run Windows portable contract suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testFiles = @(
            "tests/ktoolbox/test_action_utils.py"
            "tests/ktoolbox/test_api_contract.py"
            "tests/ktoolbox/test_blocker.py"
            "tests/ktoolbox/test_downloader_utils.py"
            "tests/ktoolbox/test_failures.py"
            "tests/ktoolbox/test_models.py"
            "tests/ktoolbox/test_naming_migration.py"
            "tests/ktoolbox/test_naming_sources.py"
            "tests/ktoolbox/test_project_config.py"
            "tests/ktoolbox/test_reporting.py"
          )
          $failed = @()
          foreach ($testFile in $testFiles) {
            Write-Output "::group::$testFile"
            $output = & poetry run pytest -q $testFile 2>&1
            $exitCode = $LASTEXITCODE
            $output | Write-Output
            Write-Output "::endgroup::"
            if ($exitCode -ne 0) {
              $failed += $testFile
              $details = (($output | Select-Object -Last 35) -join "`n")
              $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Output "::error title=Pytest failed: $testFile::$details"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Windows compatibility tests failed: $($failed -join ', ')"
            exit 1
          }
